name: arbibot

x-service: &service
  build: .
  image: arbibot
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  volumes:
    - ${ARBIBOT_DATA:-./data}:/app/data
  logging:
    options:
      max-size: 10m
      max-file: "3"

x-dry: &dry
  <<: *service
  secrets: [federbot-okx-read, federbot-bybit-read]

services:
  scanner:
    <<: *service
    command: scanner run --quotes EUR,USDC,PLN
    healthcheck:
      test: find data/opportunities -name '*.jsonl' -mmin -10 | grep -q .
      interval: 1m
      start_period: 5m

  report:
    <<: *service
    command: bot report --daily --telegram
    secrets: [federbot-telegram]

  dry:
    <<: *dry
    command: >-
      bot dry-run --pair STRK/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20
    healthcheck:
      test: find data/bot -name '*.jsonl' -mmin -3 | grep -q .
      interval: 1m
      start_period: 3m

  ab-prog35:
    <<: *dry
    command: >-
      bot dry-run --pair STRK/USDC --capital 200 --size 40 --min-bps 35
      --maker --maker-size 10 --maker-min-bps 20 --data-dir data/ab-prog35

  ab-prog50:
    <<: *dry
    command: >-
      bot dry-run --pair STRK/USDC --capital 200 --size 40 --min-bps 50
      --maker --maker-size 10 --maker-min-bps 20 --data-dir data/ab-prog50

  ab-maker10:
    <<: *dry
    command: >-
      bot dry-run --pair STRK/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 10 --data-dir data/ab-maker10

  ab-maker30:
    <<: *dry
    command: >-
      bot dry-run --pair STRK/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 30 --data-dir data/ab-maker30

  ab-szybki:
    <<: *dry
    command: >-
      bot dry-run --pair STRK/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20
      --okx-latency-ms 40 --bybit-latency-ms 100 --data-dir data/ab-szybki

  ab-rebalans:
    <<: *dry
    command: >-
      bot dry-run --pair STRK/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --trade-rebalance
      --data-dir data/ab-rebalans

  ab-w:
    <<: *dry
    command: >-
      bot dry-run --pair W/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --data-dir data/ab-w

  live:
    <<: *service
    profiles: [live]
    command: >-
      bot live --pair STRK/USDC --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --telegram --yes
    secrets:
      - federbot-okx-read
      - federbot-bybit-read
      - federbot-okx-trade
      - federbot-bybit-trade
      - federbot-telegram
    healthcheck:
      test: find data/live -name '*.jsonl' -mmin -3 | grep -q .
      interval: 1m
      start_period: 3m

secrets:
  federbot-okx-read:
    file: ${HOME}/.arbibot/secrets/federbot-okx-read
  federbot-bybit-read:
    file: ${HOME}/.arbibot/secrets/federbot-bybit-read
  federbot-okx-trade:
    file: ${HOME}/.arbibot/secrets/federbot-okx-trade
  federbot-bybit-trade:
    file: ${HOME}/.arbibot/secrets/federbot-bybit-trade
  federbot-telegram:
    file: ${HOME}/.arbibot/secrets/federbot-telegram
