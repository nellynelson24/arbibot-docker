name: arbibot

x-arbibot-labels: &arbibot-labels
  dev.dozzle.group: arbibot
  logs.access: arbibot

x-service: &service
  image: ghcr.io/nellynelson24/arbibot-docker:${ARBIBOT_VERSION:-latest}
  labels:
    <<: *arbibot-labels
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  volumes:
    - ${ARBIBOT_DATA:-./data}:/app/data
  logging:
    options:
      max-size: 10m
      max-file: "3"

x-dry: &dry
  <<: *service
  secrets: [federbot-okx-read, federbot-bybit-read]

services:
  scanner:
    <<: *service
    command: scanner run --quotes EUR,USDC,PLN
    healthcheck:
      test: find data/opportunities -name '*.jsonl' -mmin -10 | grep -q .
      interval: 1m
      start_period: 5m

  report:
    <<: *service
    command: bot report --daily --telegram
    secrets: [federbot-telegram]

  dry:
    <<: *dry
    command: >-
      bot dry-run --pair TIA/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance
    healthcheck:
      test: find data/bot -name '*.jsonl' -mmin -3 | grep -q .
      interval: 1m
      start_period: 3m

  ab-razem:
    <<: *dry
    command: >-
      bot dry-run --pair TIA/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --trade-rebalance --data-dir data/ab-razem

  ab-bez-rebalansu:
    <<: *dry
    command: >-
      bot dry-run --pair TIA/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --restore-min-bps 40 --data-dir data/ab-bez-rebalansu

  ab-p35:
    <<: *dry
    command: >-
      bot dry-run --pair TIA/USDC --capital 200 --size 40 --min-bps 35
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --data-dir data/ab-p35

  ab-p50:
    <<: *dry
    command: >-
      bot dry-run --pair TIA/USDC --capital 200 --size 40 --min-bps 50
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --data-dir data/ab-p50

  ab-m10:
    <<: *dry
    command: >-
      bot dry-run --pair TIA/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 10 --sequential --trade-rebalance --data-dir data/ab-m10

  ab-m30:
    <<: *dry
    command: >-
      bot dry-run --pair TIA/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 30 --sequential --trade-rebalance --data-dir data/ab-m30

  ab-szybki:
    <<: *dry
    command: >-
      bot dry-run --pair TIA/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance
      --okx-latency-ms 40 --bybit-latency-ms 100 --data-dir data/ab-szybki

  ab-strk:
    <<: *dry
    command: >-
      bot dry-run --pair STRK/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --data-dir data/ab-strk

  ab-arb:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --data-dir data/ab-arb

  ab-s:
    <<: *dry
    command: >-
      bot dry-run --pair S/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --data-dir data/ab-s

  live:
    <<: *service
    profiles: [live]
    command: >-
      bot live --pair TIA/USDC --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance
      --auto-transfer --telegram --yes ${ARBIBOT_LIVE_FLAGS:-}
    secrets:
      - federbot-okx-read
      - federbot-bybit-read
      - federbot-okx-trade
      - federbot-bybit-trade
      - federbot-okx-withdraw
      - federbot-bybit-withdraw
      - federbot-telegram
    healthcheck:
      test: find data/live -name '*.jsonl' -mmin -3 | grep -q .
      interval: 1m
      start_period: 3m

secrets:
  federbot-okx-read:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-okx-read
  federbot-bybit-read:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-bybit-read
  federbot-okx-trade:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-okx-trade
  federbot-bybit-trade:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-bybit-trade
  federbot-okx-withdraw:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-okx-withdraw
  federbot-bybit-withdraw:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-bybit-withdraw
  federbot-telegram:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-telegram
