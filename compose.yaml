name: arbibot

x-arbibot-labels: &arbibot-labels
  dev.dozzle.group: arbibot
  log.access.nellynelson: "true"
  log.access.test: "true"

x-service: &service
  image: ghcr.io/nellynelson24/arbibot-docker:${ARBIBOT_VERSION:-latest}
  labels:
    <<: *arbibot-labels
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  volumes:
    - ${ARBIBOT_DATA:-./data}:/app/data

x-dry: &dry
  <<: *service
  secrets: [federbot-okx-read, federbot-bybit-read]

services:
  scanner:
    <<: *service
    command: scanner run --quotes EUR,USDC,PLN --maker-min-bps 20
    healthcheck:
      test: find data/opportunities -name '*.jsonl' -mmin -10 | grep -q .
      interval: 1m
      start_period: 5m


  report:
    <<: *service
    command: bot report --daily --telegram
    secrets: [federbot-telegram]


  dry:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
    healthcheck:
      test: find data/bot -name '*.jsonl' -mmin -3 | grep -q .
      interval: 1m
      start_period: 3m

  ab-arb:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --data-dir data/ab-arb


  ab-arb-m30:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 30 --sequential --trade-rebalance --data-dir data/ab-arb-m30


  ab-arb-tani:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --data-dir data/ab-arb-tani

  ab-arb-bez:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --rebalance-max-cost-bps 0
      --data-dir data/ab-arb-bez

  ab-arb-skew:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --skew-bps 15 --data-dir data/ab-arb-skew

  ab-arb-maker20:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --data-dir data/ab-arb-maker20

  ab-strk:
    <<: *dry
    command: >-
      bot dry-run --pair STRK/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --data-dir data/ab-strk


  ab-s:
    <<: *dry
    command: >-
      bot dry-run --pair S/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 10 --maker-min-bps 20 --sequential --trade-rebalance --data-dir data/ab-s


  live:
    <<: *service
    profiles: [live]
    command: >-
      bot live --pair ${ARBIBOT_LIVE_PAIR:-ARB/USDC} --size ${ARBIBOT_SIZE:-40} --min-bps 40
      --maker --maker-size ${ARBIBOT_MAKER_SIZE:-10} --maker-min-bps ${ARBIBOT_MAKER_MIN_BPS:-20}
      --daily-loss-limit ${ARBIBOT_DAILY_LOSS:-2} --sequential --trade-rebalance
      --telegram --yes ${ARBIBOT_LIVE_FLAGS:-}
    secrets:
      - federbot-okx-read
      - federbot-bybit-read
      - federbot-okx-trade
      - federbot-bybit-trade
      - federbot-telegram
    healthcheck:
      test: find data/live -name '*.jsonl' -mmin -3 | grep -q .
      interval: 1m
      start_period: 3m

secrets:
  federbot-okx-read:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-okx-read
  federbot-bybit-read:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-bybit-read
  federbot-okx-trade:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-okx-trade
  federbot-bybit-trade:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-bybit-trade
  federbot-telegram:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-telegram
