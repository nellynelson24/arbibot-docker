name: arbibot

x-arbibot-labels: &arbibot-labels
  dev.dozzle.group: arbibot
  log.access.nellynelson: "true"
  log.access.test: "true"

x-service: &service
  image: ghcr.io/nellynelson24/arbibot-docker:${ARBIBOT_VERSION:-latest}
  labels:
    <<: *arbibot-labels
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  volumes:
    - ${ARBIBOT_DATA:-./data}:/app/data

x-dry: &dry
  <<: *service
  secrets: [federbot-okx-read, federbot-bybit-read]

services:
  scanner:
    <<: *service
    command: scanner run --quotes EUR,USDC,PLN --maker-min-bps 20
    healthcheck:
      test: find data/opportunities -name '*.jsonl' -mmin -10 | grep -q .
      interval: 1m
      start_period: 5m

  report:
    <<: *service
    command: bot report --daily --telegram
    secrets: [federbot-telegram]

  dry:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15
    healthcheck:
      test: find data/bot -name '*.jsonl' -mmin -3 | grep -q .
      interval: 1m
      start_period: 3m

  ab-arb-strict:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15 --rebalance-strict
      --data-dir data/ab-arb-strict

  ab-arb-fees50:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15 --fee-scale 0.5
      --data-dir data/ab-arb-fees50

  ab-arb-maker40:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 40 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15
      --data-dir data/ab-arb-maker40

  ab-arb-rest:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15 --maker-rest
      --data-dir data/ab-arb-rest

  ab-arb-lat:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15 --maker-latency
      --data-dir data/ab-arb-lat

  ab-arb-rest-lat:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15 --maker-rest --maker-latency
      --data-dir data/ab-arb-rest-lat

  ab-arb-net60:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15 --maker-net-secs 60
      --data-dir data/ab-arb-net60

  ab-switch:
    <<: *dry
    command: >-
      bot dry-run --pair ARB/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15
      --switch --review-hours 1 --switch-maker-hours 12 --switch-any-route
      --data-dir data/ab-switch

  ab-pepe:
    <<: *dry
    command: >-
      bot dry-run --pair PEPE/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15
      --data-dir data/ab-pepe

  ab-usdc-pln:
    <<: *dry
    command: >-
      bot dry-run --pair USDC/PLN --capital 800 --size 160 --min-bps 40
      --maker --maker-size 80 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15 --daily-loss-limit 8
      --data-dir data/ab-usdc-pln

  ab-ena:
    <<: *dry
    command: >-
      bot dry-run --pair ENA/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15
      --data-dir data/ab-ena

  ab-strk:
    <<: *dry
    command: >-
      bot dry-run --pair STRK/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15
      --data-dir data/ab-strk

  ab-s:
    <<: *dry
    command: >-
      bot dry-run --pair S/USDC --capital 200 --size 40 --min-bps 40
      --maker --maker-size 20 --maker-min-bps 20 --sequential --trade-rebalance --lazy-rebalance
      --rebalance-max-cost-bps 30 --skew-bps 15
      --data-dir data/ab-s

  live:
    <<: *service
    profiles: [live]
    command: >-
      bot live --pair ${ARBIBOT_LIVE_PAIR:-ARB/USDC} --size ${ARBIBOT_SIZE:-40} --min-bps 40
      --maker --maker-size ${ARBIBOT_MAKER_SIZE:-10} --maker-min-bps ${ARBIBOT_MAKER_MIN_BPS:-20}
      --daily-loss-limit ${ARBIBOT_DAILY_LOSS:-2} --sequential --trade-rebalance
      --telegram --yes ${ARBIBOT_LIVE_FLAGS:-}
    secrets:
      - federbot-okx-read
      - federbot-bybit-read
      - federbot-okx-trade
      - federbot-bybit-trade
      - federbot-telegram
    healthcheck:
      test: find data/live -name '*.jsonl' -mmin -3 | grep -q .
      interval: 1m
      start_period: 3m

secrets:
  federbot-okx-read:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-okx-read
  federbot-bybit-read:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-bybit-read
  federbot-okx-trade:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-okx-trade
  federbot-bybit-trade:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-bybit-trade
  federbot-telegram:
    file: ${ARBIBOT_SECRETS:-${HOME}/.arbibot/secrets}/federbot-telegram
