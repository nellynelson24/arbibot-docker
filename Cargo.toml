[workspace]
resolver = "3"
members = ["bins/bot", "bins/latency", "bins/pair-scan", "bins/scanner", "crates/account", "crates/venues"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
venues = { path = "crates/venues" }
account = { path = "crates/account" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
